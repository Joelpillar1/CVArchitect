    (function () {
      function isExternalScriptError(reason, filename, stack) {
        var text = (
          String((reason && (reason.message || reason.stack || reason)) || '') + ' ' +
          String(filename || '') + ' ' +
          String(stack || '')
        ).toLowerCase();

        return (
          text.indexOf('m_id') !== -1 ||
          text.indexOf('200.js') !== -1 ||
          text.indexOf('chrome-extension://') !== -1 ||
          text.indexOf('moz-extension://') !== -1 ||
          text.indexOf('safari-extension://') !== -1 ||
          text.indexOf('extension://') !== -1
        );
      }

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        if (isExternalScriptError(reason, '', (reason && reason.stack) || '')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function (event) {
        if (isExternalScriptError(event.error || event.message, event.filename, (event.error && event.error.stack) || '')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    })();

       Load them asynchronously after the page has painted to avoid LCP penalty. -->
  <script>
    // Defer template fonts until after first interaction or idle
    function loadTemplateFonts() {
      if (document._templateFontsLoaded) return;
      document._templateFontsLoaded = true;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Open+Sans:wght@300;400;600;700;800&family=Lato:wght@300;400;700;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Merriweather:wght@300;400;700;900&family=Fira+Code&display=swap';
      document.head.appendChild(link);
    }
    // Load on first user interaction or after 3s idle — whichever comes first
    var _tfTimer = setTimeout(loadTemplateFonts, 3000);
    ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(function(e) {
      window.addEventListener(e, function once() {
        clearTimeout(_tfTimer);
        loadTemplateFonts();
        window.removeEventListener(e, once);
      }, { once: true, passive: true });
    });
  </script>
